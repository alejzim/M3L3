<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitud recibida</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="header">
    <div class="header__text">
      <h1>¡Gracias, {{ name }}!</h1>
      <p>Hemos recibido los datos de tu solicitud.</p>
    </div>
  </header>
  <main>
    <section class="result-card">
      <h2 class="main__title">Resumen de la solicitud</h2>
      <dl class="result-list">
        <div><dt>Nombre</dt><dd>{{ name }}</dd></div>
        <div><dt>Correo electrónico</dt><dd>{{ email }}</dd></div>
        <div><dt>Dirección</dt><dd>{{ address }}</dd></div>
        <div><dt>Fecha preferida</dt><dd>{{ date }}</dd></div>
      </dl>
      <a class="main_link" href="{{ url_for('index') }}">Volver al inicio</a>
    </section>
  </main>
</body>
</html>
